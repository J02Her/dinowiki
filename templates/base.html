<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DinoWiki - {% block titulo %}Inicio{% endblock %}</title>

    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark dino-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">🦖 DinoWiki</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('catalogo') }}">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('registrar') }}">Registrar Dinosaurio</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido de cada página -->
    <main class="container my-4">
        {% block contenido %}{% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="text-center text-muted py-3 mt-5 border-top">
        <small>DinoWiki &middot; Proyecto Final de Programación &middot; Josué Salazar &middot; 10-8</small>
    </footer>

    <!-- Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
